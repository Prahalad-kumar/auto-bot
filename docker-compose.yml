services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autobot
      POSTGRES_PASSWORD: autobot
      POSTGRES_DB: autobot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobot -d autobot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./config:/config:ro"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --queues=trading
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: ["./backend:/app", "./config:/config:ro"]

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: ["./backend:/app", "./config:/config:ro"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on: [backend]
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]

volumes:
  pgdata:
